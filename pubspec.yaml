name: distrigo_repartidor
description: "DistriGO: aplicación móvil del repartidor (inicio de sesión y Mi ruta de hoy)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  cupertino_icons: 1.0.9
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  provider: 6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-PublicSans.txt

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
